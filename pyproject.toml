[build-system]
requires = [
  "setuptools >= 77",
]
build-backend = "setuptools.build_meta"

[project]
name = "srs_sr830"
version = "0.0.1"
description = "Control a Stanford Research Systems SR830 lock-in amplifier"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Ball" }]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "pyvisa",
  "pyvisa-py",
]

[project.urls]
Homepage = "https://github.com/jmball/srs_sr830"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
sr830 = ["py.typed"]
virtual_sr830 = ["py.typed"]

[project.optional-dependencies]
test = [
  "pytest >= 8.3",
  "pytest-cov >= 5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
  "unit: isolated tests using fake VISA resources",
  "integration: tests using VirtualSR830 or the selected VISA instrument",
  "hardware: checks requiring a real SR830",
]

[tool.coverage.run]
source = ["sr830", "virtual_sr830"]
branch = true
